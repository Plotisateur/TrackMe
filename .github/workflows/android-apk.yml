name: Android APK

# Builds an installable release APK (signed with the debug keystore — for sideloading
# on your own phone, not for Play Store upload) and attaches it as a workflow artifact.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck, lint, test
        run: npm run typecheck && npm run lint && npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/gamma-tracker-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gamma-tracker-apk
          path: dist/*.apk
          retention-days: 30
